<!-- ORION Card Component
     Usage: include via JS with Card.create({ title, body, badge, id })
     or copy the template below directly into a page.
-->

<template id="tmpl-card">
    <div class="dash-card orion-card" data-card-id="">
        <div class="dash-card-header">
            <h3 class="card-title"></h3>
            <span class="card-badge" style="display:none;"></span>
            <div class="card-header-actions"></div>
        </div>
        <div class="card-body"></div>
    </div>
</template>
