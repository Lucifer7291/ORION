<!-- ORION Modal Component Template -->
<template id="tmpl-modal">
    <div class="modal-overlay orion-modal" id="" role="dialog" aria-modal="true" style="display:none;">
        <div class="modal-box">
            <div class="modal-header">
                <h3 class="modal-title"></h3>
                <button class="modal-close-btn" aria-label="Close">✕</button>
            </div>
            <div class="modal-body"></div>
            <div class="modal-footer">
                <button class="btn-orion btn-ghost modal-cancel-btn">Cancel</button>
                <button class="btn-orion btn-primary modal-confirm-btn">Confirm</button>
            </div>
        </div>
    </div>
</template>
